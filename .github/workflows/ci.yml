name: Hydranten App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: 🛡️ Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Lint (ESLint)
      run: npm run lint
      
    - name: Verify Translations
      run: npm run verify:i18n
      
    - name: Unit Tests (Vitest)
      run: npm run test

  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Build App
      run: npm run build
