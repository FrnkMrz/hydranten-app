name: Hydranten App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality:
    name: 🛡️ Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci

    - name: Audit npm Dependencies
      # High/critical advisories fail the build; documented exceptions live in scripts/audit-check.js.
      run: node scripts/audit-check.js
      
    - name: Lint (ESLint)
      run: npm run lint
      
    - name: Verify Translations
      run: npm run verify:i18n
      
    - name: Unit Tests (Vitest)
      run: npm run test

  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Build App
      run: npm run build

    - name: Upload GitHub Pages artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
      with:
        path: ./dist

  e2e:
    name: 📱 Mobile E2E Tests
    runs-on: ubuntu-latest
    # No "needs": E2E runs alongside the quality job. Deploy still waits for
    # quality, because build needs it.
    #
    # The official Playwright image already contains the browsers and their
    # system libraries. Installing them with "--with-deps" pulled 139 MB of
    # Ubuntu packages through apt on every run, which once took 18 minutes.
    # Keep the tag in step with @playwright/test in package-lock.json; the
    # check below warns and falls back to a download if they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    # A normal run takes 1 to 2 minutes; 40 leaves room for a slow image pull
    # while still stopping a truly hung job.
    timeout-minutes: 40
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.0
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Check Playwright Browsers
      run: |
        installed=$(node -p "require('@playwright/test/package.json').version")
        if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
          echo "::warning::@playwright/test is $installed but the E2E image is $PLAYWRIGHT_IMAGE_VERSION. Update the image tag in ci.yml. Downloading matching browsers for now."
          npx playwright install chromium webkit
        fi

    - name: Run Mobile E2E Tests
      run: npm run test:e2e

    - name: Upload Playwright Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

  deploy:
    name: 🚀 Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
